name: Publish Decide Fate
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game
        run: |
          node battle-view.test.cjs
          node battle-data.test.cjs
          node combat-data.test.cjs
          node tactical.test.cjs
          node adventure.test.cjs
          node large-map.test.cjs
          node battle-presets.test.cjs
          node rules.test.cjs
          node creation-system.test.cjs
          node legacy-content-parity.test.cjs
          node catalog-economy.test.cjs
          node catalog-loot.test.cjs
          node catalog-combat-items.test.cjs
          node catalog-equipment.test.cjs
          node elements.test.cjs
          node status-immunity.test.cjs
          node catalog-actions.test.cjs
          node monster-ai.test.cjs
          node monster-passives.test.cjs
          node monster-stats.test.cjs
          node monster-grid.test.cjs
          node combat-lab.test.cjs
          node grid-patterns.test.cjs
          node status-effects.test.cjs
          node displacement.test.cjs
          node grid-hazards.test.cjs
          node hazard-navigation.test.cjs
          node monster-tactics.test.cjs
          node combat-lab-party.test.cjs
          node content-authoring.test.cjs
          node cloud.test.cjs
          node character-art-data.test.cjs
          node library-merge.test.cjs
          node look-around.test.cjs
          node map-data.test.cjs
          node tactical-v2.test.cjs
          node weapon-motion.test.cjs
          node grid-closeout.test.cjs
          node database-live-links.test.cjs
          node content-integration-audit.test.cjs
          node world-travel.test.cjs
          node event-story.test.cjs
          node weapon-patterns.test.cjs
          node world-links.test.cjs
          node closeout-resume.test.cjs
          node closeout-custom-services.test.cjs
          node closeout-authoring.test.cjs
          node closeout-sync.test.cjs
          node closeout-handoff.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

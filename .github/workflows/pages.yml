name: Publish Decide Fate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game
        run: |
          node battle-view.test.cjs
          node battle-data.test.cjs
          node combat-data.test.cjs
          node tactical.test.cjs
          node adventure.test.cjs
          node large-map.test.cjs
          node battle-presets.test.cjs
          node rules.test.cjs
          node creation-system.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
